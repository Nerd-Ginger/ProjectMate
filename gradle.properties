org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is deliberately off for now. AGP 9.3 + KSP 2.3 is a young
# combination, and a configuration-cache failure is a confusing first thing to
# debug when CI is the only place the Android modules build at all. Turn it on
# once the build is green and stable.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships a new Android DSL. This opts back into the previous one, which is
# what app/build.gradle.kts is written against.
#
# This is a temporary compatibility flag and counts as debt — it is here to get
# a first green build, not to stay. Migrating to the new DSL and removing this
# is tracked as follow-up work. See docs/DECISIONS.md D-014.
android.newDsl=false

kotlin.code.style=official
