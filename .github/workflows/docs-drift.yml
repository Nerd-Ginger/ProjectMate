name: Docs drift

# A nudge, not a gate. CLAUDE.md asks that behaviour changes update the
# matching document in the same commit; this posts a reminder when the diff
# suggests that didn't happen. It never fails the build — a doc reminder should
# not be able to block a fix.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check docs kept pace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare changed paths against their docs
        id: drift
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=50
          CHANGED="$(git diff --name-only "$BASE"...HEAD)"

          missing=""
          check() {
            if echo "$CHANGED" | grep -qE "$1" && ! echo "$CHANGED" | grep -qF "$2"; then
              missing="${missing}- \`$2\` — code under \`$3\` changed\n"
            fi
          }

          check '^app/src/main/kotlin/.*/data/'  'docs/DATA_MODEL.md'             'app/.../data/'
          check '^core/src/main/kotlin/.*/transfer/' 'docs/FEATURE_REQUEST_SCHEMA.md' 'core/.../transfer/'
          check '^\.github/workflows/'          'docs/ARCHITECTURE.md'           '.github/workflows/'

          if [ -n "$missing" ]; then
            {
              echo "body<<EOF"
              echo "Docs may have drifted. The rule in \`CLAUDE.md\` is that behaviour changes update their matching doc in the same commit:"
              echo ""
              printf "%b" "$missing"
              echo ""
              echo "_If this is a false positive, ignore it — this check never fails the build._"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Comment
        if: steps.drift.outputs.body != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.BODY + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_"
            })
        env:
          BODY: ${{ steps.drift.outputs.body }}
