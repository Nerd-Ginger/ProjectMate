name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback on the pure-Kotlin module. No Android SDK, so this finishes
  # in well under a minute and catches most logic errors before the slow job
  # has finished setting up.
  core:
    name: Core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Run :core tests
        # The runner image ships an Android SDK and sets ANDROID_HOME globally,
        # which would make settings.gradle.kts configure :app here too. Blanking
        # it keeps this job doing exactly what it claims: the pure-JVM module,
        # with no Android configuration at all.
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
        run: ./gradlew :core:test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
          retention-days: 7

  android:
    name: Android build
    runs-on: ubuntu-latest
    permissions:
      # Needed to commit Room's exported schemas back — see the step at the end.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # Sets ANDROID_HOME, which is also what tells settings.gradle.kts to
      # include the :app module at all.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v5

      # Deliberately no --stacktrace. Gradle's internal stack is ~120 lines and
      # pushes the actual `e: file://…build.gradle.kts:NN` compile errors out of
      # any readable slice of the log. Since this job is the only place Android
      # code compiles at all, legible errors matter more than stack depth.
      - name: Assemble, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --warning-mode=summary

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/projectmate-debug-${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projectmate-debug-apk
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

      # Room writes its schema JSON during the build, and those files are meant
      # to be committed so migrations can be tested against real historical
      # versions. Since the build only ever runs here, this is the only way to
      # get them back out.
      - name: Upload reports and generated schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/schemas/
          retention-days: 7
          if-no-files-found: ignore

      # Room exports its schema JSON during the build, and those files are
      # meant to be committed so migrations can be tested against real
      # historical versions. The build only ever runs here, so this is the only
      # place they can be produced. Committing them back keeps the repo's
      # schema history honest without anyone having to remember.
      #
      # [skip ci] in the message prevents this push from triggering another run.
      - name: Commit exported Room schemas
        if: success() && github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain app/schemas 2>/dev/null)" ]; then
            echo "Schemas unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          git commit -m "chore(db): export Room schema [skip ci]" \
                     -m "Generated by the build. Committed so migrations can be tested against real historical schemas."
          # Rebase rather than force: a human push mid-run must not be lost.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
